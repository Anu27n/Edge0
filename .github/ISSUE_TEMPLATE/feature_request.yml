name: 💡 Feature request
description: Suggest a capability, backend, platform, or API improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the [roadmap in the README](https://github.com/Edge0-AI/Edge0#roadmap)
        and existing issues — several popular asks are already tracked (CUDA backend #107/#20/#19,
        non-macOS support #18, tool/function calling #115/#119).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New backend (CUDA / other accelerator)
        - New platform support
        - Server / OpenAI-compatible API
        - CLI / Python API
        - Quantization / adapters (LoRA / prerouter)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case and who it helps. "I have an NVIDIA GPU and want to run edge0-8b for ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? If you're willing to contribute it, say so — we love PRs (see docs/adding-a-model.md for model work).
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
