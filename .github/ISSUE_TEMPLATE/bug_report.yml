name: 🐞 Bug report
description: Something is broken, crashes, or produces wrong/garbled output.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the environment fields — most issues we see
        (garbled output, install errors, collapse-to-`!` loops) are pinned down by the platform,
        chip, mlx version, and whether the prerouter/LoRA adapters are loaded.

        **Before filing:** search [existing issues](https://github.com/Edge0-AI/Edge0/issues?q=is%3Aissue)
        and check the [known mlx version pin](https://github.com/Edge0-AI/Edge0/blob/main/python/pyproject.toml)
        (A18 / A18 Pro garbled output → `mlx==0.30.6`, see #8).

  - type: dropdown
    id: platform
    attributes:
      label: Platform / runtime
      description: Which runtime are you using?
      options:
        - Python (MLX, Apple Silicon macOS)
        - macOS app / CLI (Rust)
        - iOS app
        - Android app / engine
        - Windows app / engine
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Model tier
      options:
        - edge0-35b
        - edge0-8b
        - both
        - other / custom checkpoint
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware / chip
      description: e.g. "Mac mini M4 Pro", "MacBook Air M1", "iPhone 16 Pro (A18 Pro)", "RTX 4090", "Pixel 10 Pro".
      placeholder: Apple M1 Pro
    validations:
      required: true

  - type: input
    id: ram
    attributes:
      label: RAM / unified memory
      description: Total memory of the device. Many "slow" / OOM reports come from low-memory machines.
      placeholder: 16 GB
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: macOS 15.1 / Windows 11 23H2 / Android 15 / iOS 18.1
    validations:
      required: true

  - type: input
    id: mlx_version
    attributes:
      label: mlx / mlx-metal / mlx-lm version (Python runtime only)
      description: "Output of: pip show mlx mlx-metal mlx-lm | grep -i version — pin is mlx==0.30.6, mlx-lm==0.31.0."
      placeholder: mlx 0.30.6, mlx-metal 0.30.6, mlx-lm 0.31.0
    validations:
      required: false

  - type: dropdown
    id: install_method
    attributes:
      label: How did you install / get the model?
      options:
        - pip install -e '.[dev,fetch]' from source
        - scripts/fetch_models.py
        - huggingface-cli download
        - ModelScope
        - Prebuilt app (macOS/iOS/Android/Windows)
        - Other (describe below)
    validations:
      required: false

  - type: dropdown
    id: adapters
    attributes:
      label: Adapters in use
      description: Does the bug still happen with the prerouter disabled? (`--no-prerouter`) This isolates a whole class of bugs (see #16).
      options:
        - Default (prerouter + LoRA enabled)
        - "--no-prerouter"
        - "--no-lora"
        - Both disabled (bare base model)
    validations:
      required: false

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: After the 3rd request in the same process, every output collapses to "!!!!".
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands / code. Include the prompt if output is wrong.
      placeholder: |
        1. edge0 serve edge0-35b
        2. curl -X POST http://127.0.0.1:8000/v1/chat/completions -d '...'
        3. Repeat 3 times
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace / output
      description: Paste any error output or the garbled text. This will be rendered as code, no need for backticks.
      render: shell
    validations:
      required: false
